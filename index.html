<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Notes Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>📚 Class Notes Hub</h1>
  <p>Share • Learn • Grow</p>
</header>

<main>

  <!-- Welcome -->
  <section class="welcome">
    <h2>Welcome to Class Notes Hub</h2>
    <p>Find useful notes shared by your classmates.</p>

    <div id="authButtons">
      <button onclick="openLogin()">Login</button>
      <button onclick="openSignup()">Create Account</button>
    </div>

    <div id="userArea" style="display:none;">
      <h3 id="welcomeUser"></h3>
      <button onclick="logout()">Logout</button>
    </div>
  </section>


  <!-- Upload Notes -->
  <section id="uploadSection" style="display:none;">
    <h2>📤 Upload Notes</h2>

    <input id="noteTitle" type="text" placeholder="Note title">

    <input id="noteSubject" type="text" placeholder="Subject">

    <textarea id="noteDescription"
      placeholder="Short description (optional)"></textarea>

    <input id="noteFile" type="file" accept=".pdf,application/pdf">

    <button onclick="uploadNote()">Upload Note</button>

    <p id="uploadMessage"></p>
  </section>


  <!-- Admin Dashboard -->
  <section id="adminSection" style="display:none;">
    <h2>👑 Admin Dashboard</h2>

    <button onclick="loadPendingNotes()">
      🔄 Refresh Pending Notes
    </button>

    <div id="pendingNotes">
      Loading...
    </div>
  </section>


  <!-- Approved Notes -->
  <section class="notes">
    <h2>📖 Approved Notes</h2>

    <div id="approvedNotes">
      Loading notes...
    </div>
  </section>

</main>


<!-- Login / Signup popup -->

<div id="authModal" class="modal">

  <div class="modal-box">

    <span class="close" onclick="closeAuth()">×</span>

    <!-- Login -->

    <div id="loginForm">

      <h2>Login</h2>

      <input id="loginEmail"
        type="email"
        placeholder="Email">

      <input id="loginPassword"
        type="password"
        placeholder="Password">

      <button onclick="login()">Login</button>

      <p>
        Don't have an account?
        <a href="#" onclick="showSignup(); return false;">
          Create Account
        </a>
      </p>

    </div>


    <!-- Signup -->

    <div id="signupForm" style="display:none;">

      <h2>Create Account</h2>

      <input id="signupName"
        type="text"
        placeholder="Full Name">

      <input id="signupEmail"
        type="email"
        placeholder="Email">

      <input id="signupPassword"
        type="password"
        placeholder="Password">

      <button onclick="signup()">Create Account</button>

      <p>
        Already have an account?
        <a href="#" onclick="showLogin(); return false;">
          Login
        </a>
      </p>

    </div>

    <p id="authMessage"></p>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
