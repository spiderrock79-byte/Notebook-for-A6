<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class Notes Hub</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>📚 Class Notes Hub</h1>
    <p>Share • Learn • Grow</p>
  </header>

  <main>

    <section class="hero">
      <h2>Welcome to Class Notes Hub</h2>

      <p>
        Find useful notes shared by your classmates.
      </p>

      <div class="buttons">
        <button onclick="showMessage('Login')">
          Login
        </button>

        <button onclick="showMessage('Signup')">
          Create Account
        </button>
      </div>
    </section>

    <section class="notes-section">
      <h2>📖 Approved Notes</h2>

      <p id="notesMessage">
        Notes will appear here after they are approved.
      </p>
    </section>

  </main>

  <footer>
    <p>© 2026 Class Notes Hub</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
